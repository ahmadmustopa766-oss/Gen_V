<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my Form</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"> 
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">

</head>
<body>
    
<form>
  <div class="form-group row" style="padding-left: 5%;">
    <label for="text" class="col-2 col-form-label">nama</label> 
    <div class="col-8">
      <div class="input-group">
        <div class="input-group-prepend">
          <div class="input-group-text">
            <i class="fa fa-address-book-o"></i>
          </div>
        </div> 
        <input id="text" name="text" type="text" class="form-control">
      </div>
    </div>
  </div>
  <div class="form-group row" style="padding-left: 5%;">
    <label for="text2" class="col-2 col-form-label">Kelas</label> 
    <div class="col-8">
      <div class="input-group">
        <div class="input-group-prepend">
          <div class="input-group-text">
            <i class="fa fa-graduation-cap"></i>
          </div>
        </div> 
        <input id="text2" name="text2" type="text" class="form-control">
      </div>
    </div>
  </div>
  <div class="form-group row" style="padding-left: 5%;">
    <label for="text1" class="col-2 col-form-label">pengambilan: Hari/Tanggal/Bulan</label> 
    <div class="col-8">
      <div class="input-group">
        <div class="input-group-prepend">
          <div class="input-group-text">
            <i class="fa fa-calendar"></i>
          </div>
        </div> 
        <input id="text1" name="text1" type="text" class="form-control">
      </div>
    </div>
  </div>
  <div class="form-group row" style="padding-left: 5%;">
    <label for="select" class="col-2 col-form-label">Mata Kuliah</label> 
    <div class="col-8">
      <select id="select" name="select" class="custom-select">
        <option value="T">Tahfidz</option>
        <option value="B">Bahasa Asing</option>
        <option value="B">Bisnis</option>
      </select>
    </div>
  </div>
  <div class="form-group row" style="padding-left: 5%;">
    <label class="col-2 col-form-label">Nama Buku</label> 
    <div class="col-8">
      <div class="custom-controls-stacked">
        <div class="custom-control custom-radio">
          <input name="radio" id="radio_0" type="radio" class="custom-control-input" value="th"> 
          <label for="radio_0" class="custom-control-label">The World</label>
        </div>
      </div>
      <div class="custom-controls-stacked">
        <div class="custom-control custom-radio">
          <input name="radio" id="radio_1" type="radio" class="custom-control-input" value="AL"> 
          <label for="radio_1" class="custom-control-label">Al-Qur'an</label>
        </div>
      </div>
      <div class="custom-controls-stacked">
        <div class="custom-control custom-radio">
          <input name="radio" id="radio_2" type="radio" class="custom-control-input" value="bs"> 
          <label for="radio_2" class="custom-control-label">Buku Saku</label>
        </div>
      </div>
      <div class="custom-controls-stacked">
        <div class="custom-control custom-radio">
          <input name="radio" id="radio_3" type="radio" class="custom-control-input" value="N"> 
          <label for="radio_3" class="custom-control-label">Novel</label>
        </div>
      </div>
      <div class="custom-controls-stacked">
        <div class="custom-control custom-radio">
          <input name="radio" id="radio_4" type="radio" class="custom-control-input" value="km"> 
          <label for="radio_4" class="custom-control-label">Kamus Mandarin</label>
        </div>
      </div>
    </div>
  </div>
  <div class="form-group row" style="padding-left: 5%;">
    <label for="textarea" class="col-2 col-form-label">keterangan</label> 
    <div class="col-8">
      <textarea id="textarea" name="textarea" cols="40" rows="5" class="form-control"></textarea>
    </div>
  </div>
  <div class="form-group row" style="padding-left: 5%;">
    <label for="text3" class="col-2 col-form-label">waktu pengembalian</label> 
    <div class="col-8">
      <div class="input-group">
        <div class="input-group-prepend">
          <div class="input-group-text">
            <i class="fa fa-book"></i>
          </div>
        </div> 
        <input id="text3" name="text3" type="text" class="form-control"> 
        <div class="input-group-append">
          <div class="input-group-text"></div>
        </div>
      </div>
    </div>
  </div> 
  <div class="form-group row" style="padding-left: 5%;">
    <div class="offset-4 col-8">
      <button name="submit" type="submit" class="btn btn-primary">Submit</button>
    </div>
  </div>
</form>
</body>
</html>
