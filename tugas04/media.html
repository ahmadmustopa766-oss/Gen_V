<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Tag Media HTML</title>
    <link rel="icon" type="image/x-icon" href="logo.ico">
 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
 
    <style>
        /* ===== Warna & ukuran dasar (tema malam kota) ===== */
        :root {
            color-scheme: dark;
            --bg: #070a12;
            --surface: #111726;
            --text: #e9edf8;
            --muted: #98a3c0;
            --line: #232c45;
            --accent: #ffd23f;
            --accent-2: #fff1a8;
            --accent-soft: rgba(255, 210, 63, .12);
            --media-bg: #04060c;
            --shadow: 0 10px 30px rgba(0, 0, 0, .45);
            --shadow-hover: 0 0 0 1px rgba(255, 210, 63, .35), 0 18px 44px rgba(255, 210, 63, .14);
        }
 
        /* ===== Reset sederhana ===== */
        *, *::before, *::after { box-sizing: border-box; }
 
        html { scroll-behavior: smooth; }
 
        body {
            position: relative;
            margin: 0;
            min-height: 100vh;
            padding: 2.5rem 1.25rem 7rem;
            background: radial-gradient(120% 80% at 50% 0%, #121a33 0%, var(--bg) 60%);
            background-attachment: fixed;
            color: var(--text);
            font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
            line-height: 1.6;
            text-align: center;
            overflow-x: hidden;
        }
 
        /* ===== Latar malam: bulan, lampu sorot, gedung, kelelawar terbang ===== */
        .latar {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }
 
        .bulan {
            position: absolute;
            top: 6%;
            right: 8%;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #fffbe6, #ffe9a0 60%, #f5cf5e);
            box-shadow: 0 0 60px 20px rgba(255, 222, 120, .25);
            opacity: .9;
            animation: denyut 6s ease-in-out infinite alternate;
        }
 
        @keyframes denyut {
            from { box-shadow: 0 0 50px 14px rgba(255, 222, 120, .18); }
            to   { box-shadow: 0 0 80px 28px rgba(255, 222, 120, .32); }
        }
 
        .lampu {
            position: absolute;
            bottom: 0;
            left: 12%;
            width: 220px;
            height: 78vh;
            background: linear-gradient(to top, rgba(255, 230, 140, .28), rgba(255, 230, 140, 0));
            clip-path: polygon(46% 100%, 54% 100%, 100% 0, 0 0);
            transform-origin: 50% 100%;
            animation: sorot 9s ease-in-out infinite alternate;
        }
 
        @keyframes sorot {
            from { transform: rotate(-22deg); }
            to   { transform: rotate(28deg); }
        }
 
        .kota {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 26vh;
            min-height: 150px;
        }
 
        .jendela { animation: kelip 4s ease-in-out infinite; }
        .jendela:nth-child(3n)   { animation-duration: 5.5s; animation-delay: -1s; }
        .jendela:nth-child(4n+1) { animation-duration: 3.2s; animation-delay: -2s; }
        .jendela:nth-child(5n)   { animation-duration: 7s;   animation-delay: -3s; }
 
        @keyframes kelip {
            0%, 100% { opacity: .9; }
            45%, 55% { opacity: .12; }
        }
 
        .terbang {
            position: absolute;
            left: -60px;
            width: 34px;
            color: #05070d;
            animation: lintas 16s linear infinite;
        }
 
        .terbang svg {
            display: block;
            width: 100%;
            fill: currentColor;
            transform-origin: center;
            animation: kepak .35s ease-in-out infinite alternate;
        }
 
        .terbang:nth-child(5) { top: 14%; animation-duration: 19s; }
        .terbang:nth-child(6) { top: 30%; width: 24px; animation-duration: 14s; animation-delay: -6s; }
        .terbang:nth-child(7) { top: 22%; width: 42px; animation-duration: 23s; animation-delay: -11s; }
 
        @keyframes lintas {
            0%   { transform: translate(0, 0); }
            25%  { transform: translate(28vw, -18px); }
            50%  { transform: translate(58vw, 14px); }
            75%  { transform: translate(86vw, -12px); }
            100% { transform: translate(115vw, 6px); }
        }
 
        @keyframes kepak {
            from { transform: scaleY(1); }
            to   { transform: scaleY(.45); }
        }
 
        /* ===== Tata letak: semua di tengah ===== */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 780px;
            margin: 0 auto;
        }
 
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            width: 100%;
        }
 
        /* ===== Header ===== */
        header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 2.25rem;
            animation: naik .8s ease both;
        }
 
        header h1 {
            margin: .75rem 0;
            font-size: clamp(2rem, 6vw, 3rem);
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -.02em;
            background: linear-gradient(100deg, var(--accent), var(--accent-2), var(--accent));
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: kilau 6s linear infinite;
        }
 
        header p {
            margin: 0 auto;
            max-width: 46ch;
            color: var(--muted);
        }
 
        @keyframes kilau {
            to { background-position: 200% center; }
        }
 
        /* ===== Maskot: Kalong si kelelawar ===== */
        .panggung {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
 
        .bubble {
            position: relative;
            max-width: 290px;
            margin-bottom: 14px;
            padding: .7rem 1.1rem;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
            box-shadow: var(--shadow);
            font-size: .92rem;
            font-weight: 500;
            transition: opacity .25s ease, transform .25s ease;
        }
 
        .bubble::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: -8px;
            width: 14px;
            height: 14px;
            margin-left: -7px;
            background: var(--surface);
            border-right: 1px solid var(--line);
            border-bottom: 1px solid var(--line);
            transform: rotate(45deg);
        }
 
        .bubble.ganti {
            opacity: 0;
            transform: translateY(6px);
        }
 
        .maskot {
            position: relative;
            width: 250px;
            padding: 0;
            border: 0;
            background: none;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
 
        .maskot svg {
            display: block;
            width: 100%;
            height: auto;
            overflow: visible;
        }
 
        .maskot.loncat svg {
            animation: sambar .7s ease;
        }
 
        @keyframes sambar {
            0%, 100% { transform: translate(0, 0) rotate(0); }
            30%      { transform: translate(-18px, -30px) rotate(-8deg); }
            65%      { transform: translate(18px, -10px) rotate(6deg); }
        }
 
        /* Gerakan tiap bagian kelelawar */
        .badan-kalong { animation: melayang-pelan 3s ease-in-out infinite; }
        .sayap-kiri   { animation: kepak-kiri .55s ease-in-out infinite alternate; transform-origin: 112px 108px; }
        .sayap-kanan  { animation: kepak-kanan .55s ease-in-out infinite alternate; transform-origin: 128px 108px; }
        .mata         { animation: kedip 4.5s infinite; transform-box: fill-box; transform-origin: center; }
        .telinga      { animation: kedut 5s ease-in-out infinite; transform-origin: 120px 64px; }
 
        @keyframes melayang-pelan {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-10px); }
        }
        @keyframes kepak-kiri {
            from { transform: rotate(-22deg) scaleY(1); }
            to   { transform: rotate(14deg) scaleY(.85); }
        }
        @keyframes kepak-kanan {
            from { transform: rotate(22deg) scaleY(1); }
            to   { transform: rotate(-14deg) scaleY(.85); }
        }
        @keyframes kedip {
            0%, 92%, 100% { transform: scaleY(1); }
            96%           { transform: scaleY(.08); }
        }
        @keyframes kedut {
            0%, 88%, 100% { transform: rotate(0); }
            92%           { transform: rotate(-3deg); }
            96%           { transform: rotate(3deg); }
        }
 
        .pupil { transition: transform .12s ease-out; }
 
        /* Headphone & nada musik muncul saat lagu diputar */
        .headphone {
            opacity: 0;
            transform: translateY(-8px);
            transition: opacity .3s ease, transform .3s ease;
        }
 
        body.musik .headphone {
            opacity: 1;
            transform: translateY(0);
        }
 
        .nada {
            position: absolute;
            top: 24%;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent);
            opacity: 0;
            pointer-events: none;
        }
 
        .nada:nth-of-type(1) { left: 6%; }
        .nada:nth-of-type(2) { right: 6%; }
        .nada:nth-of-type(3) { left: 22%; top: 14%; }
 
        body.musik .nada { animation: nada 2.6s ease-in infinite; }
        body.musik .nada:nth-of-type(2) { animation-delay: .9s; }
        body.musik .nada:nth-of-type(3) { animation-delay: 1.7s; }
 
        @keyframes nada {
            0%   { opacity: 0; transform: translateY(0) rotate(0); }
            20%  { opacity: 1; }
            100% { opacity: 0; transform: translateY(-80px) rotate(18deg); }
        }
 
        body.musik .badan-kalong { animation: joget .7s ease-in-out infinite alternate; }
        body.musik .sayap-kiri  { animation-duration: .3s; }
        body.musik .sayap-kanan { animation-duration: .3s; }
 
        @keyframes joget {
            from { transform: translateY(0) rotate(-3deg); }
            to   { transform: translateY(-10px) rotate(3deg); }
        }
 
        /* ===== Kartu per media ===== */
        .section {
            width: 100%;
            padding: 1.5rem;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 20px;
            box-shadow: var(--shadow);
            transition: transform .3s ease, box-shadow .3s ease, border-color .3s ease;
        }
 
        .section:hover {
            transform: translateY(-6px);
            border-color: var(--accent);
            box-shadow: var(--shadow-hover);
        }
 
        .section h2 {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: .6rem;
            margin: 0 0 1.1rem;
            font-size: 1.1rem;
            font-weight: 700;
        }
 
        .section h2 code {
            padding: .15rem .6rem;
            background: var(--accent-soft);
            color: var(--accent);
            border-radius: 6px;
            font-size: .85rem;
            font-weight: 700;
        }
 
        /* ===== Media ===== */
        .media {
            display: block;
            width: 100%;
            margin: 0 auto;
            border-radius: 12px;
        }
 
        img.media {
            max-height: 420px;
            object-fit: contain;
            background: var(--media-bg);
            transition: transform .5s ease;
        }
 
        .section:hover img.media {
            transform: scale(1.03);
        }
 
        audio.media {
            border-radius: 999px;
        }
 
        video.media,
        iframe.media {
            aspect-ratio: 16 / 9;
            height: auto;
            border: 0;
            background: var(--media-bg);
        }
 
        /* ===== Footer ===== */
        footer {
            margin-top: 2.5rem;
            color: var(--muted);
            font-size: .85rem;
            animation: naik .8s ease both;
        }
 
        /* ===== Animasi muncul ===== */
        @keyframes naik {
            from { opacity: 0; transform: translateY(28px); }
            to   { opacity: 1; transform: translateY(0); }
        }
 
        .js .reveal {
            opacity: 0;
            transform: translateY(36px);
            transition: opacity .7s ease, transform .7s ease,
                        box-shadow .3s ease, border-color .3s ease;
        }
 
        .js .reveal.tampil {
            opacity: 1;
            transform: translateY(0);
        }
 
        .js .reveal.tampil:hover {
            transform: translateY(-6px);
        }
 
        /* ===== Fokus keyboard ===== */
        :focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 4px;
            border-radius: 12px;
        }
 
        /* ===== Hormati pengguna yang mematikan animasi ===== */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
                scroll-behavior: auto !important;
            }
            .js .reveal { opacity: 1; transform: none; }
            .terbang, .lampu { display: none; }
        }
 
        @media (max-width: 480px) {
            body { padding: 1.75rem 1rem 6rem; }
            .section { padding: 1.1rem; border-radius: 16px; }
            .maskot { width: 210px; }
            .bulan { width: 70px; height: 70px; }
            .lampu { width: 150px; }
        }
    </style>
 
    <script>
        // Tandai bahwa JavaScript aktif agar animasi muncul bisa dipakai
        document.documentElement.classList.add('js');
    </script>
</head>

                    src="https://www.youtube.com/embed/ZBONqmVxYkM?si=A69E6afCTBpULTSc"
                    title="YouTube video player"
                    loading="lazy"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen></iframe>
            </section>
 
            <!-- Tag iframe: video loop dari website lain -->
            <section class="section reveal">
                <h2><code>&lt;iframe&gt;</code> Embed Video Loop</h2>
                <iframe
                    class="media"
                    src="https://onepagelove.com/wp-content/uploads/opl-video/posts/88651/d4ce74f47ea17fd4e890bbf723c6458d/loop.mp4"
                    title="Video loop dari One Page Love"
                    loading="lazy"></iframe>
            </section>
        </main>
 
        <footer>
            <p>Dibuat untuk latihan HTML</p>
        </footer>
 
    </div>
 
    <script>
        // ===== Munculkan setiap kartu saat masuk ke layar =====
        const kartu = document.querySelectorAll('.reveal');
 
        if ('IntersectionObserver' in window) {
            const pengamat = new IntersectionObserver((daftar) => {
                daftar.forEach((item) => {
                    if (item.isIntersecting) {
                        item.target.classList.add('tampil');
                        pengamat.unobserve(item.target);
                    }
                });
            }, { threshold: 0.15 });
 
            kartu.forEach((el) => pengamat.observe(el));
        } else {
            kartu.forEach((el) => el.classList.add('tampil'));
        }
 
        // ===== Maskot Kalong =====
        const maskot = document.getElementById('maskot');
        const bubble = document.getElementById('bubble');
        const pupilKiri = document.getElementById('pupilKiri');
        const pupilKanan = document.getElementById('pupilKanan');
        const audio = document.getElementById('audio');
        const video = document.getElementById('video');
        const kurangiGerak = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 
        const sapaan = [
            'Hai! Aku Kalong, penjaga halaman ini di malam hari.',
            'Scroll ke bawah ya, ada gambar, lagu, dan video.',
            'Cit cit! Klik aku lagi untuk sapaan lain.',
            'Latihan HTML-mu makin rapi nih!'
        ];
        let urutan = 0;
 
        function ucap(teks) {
            bubble.classList.add('ganti');
            setTimeout(() => {
                bubble.textContent = teks;
                bubble.classList.remove('ganti');
            }, 250);
        }
 
        maskot.addEventListener('click', () => {
            urutan = (urutan + 1) % sapaan.length;
            ucap(sapaan[urutan]);
            maskot.classList.remove('loncat');
            void maskot.offsetWidth; // mulai ulang animasi
            maskot.classList.add('loncat');
        });
 
        // Mata mengikuti kursor / sentuhan
        if (!kurangiGerak) {
            document.addEventListener('pointermove', (e) => {
                const kotak = maskot.getBoundingClientRect();
                const pusatX = kotak.left + kotak.width / 2;
                const pusatY = kotak.top + kotak.height * 0.43;
                const dx = e.clientX - pusatX;
                const dy = e.clientY - pusatY;
                const jarak = Math.hypot(dx, dy) || 1;
                const geser = Math.min(4, jarak / 40);
                const x = (dx / jarak) * geser;
                const y = (dy / jarak) * geser;
                const gaya = `translate(${x}px, ${y}px)`;
                pupilKiri.style.transform = gaya;
                pupilKanan.style.transform = gaya;
            });
        }
 
        // Kalong bereaksi saat lagu dan video diputar
        audio.addEventListener('play', () => {
            document.body.classList.add('musik');
            ucap('Wah, lagunya enak! Aku ikut dengerin.');
        });
        ['pause', 'ended'].forEach((nama) => {
            audio.addEventListener(nama, () => {
                document.body.classList.remove('musik');
                ucap('Musiknya berhenti. Lanjut lihat video?');
            });
        });
        video.addEventListener('play', () => ucap('Videonya kucing! Hmm, aku jadi lapar.'));
    </script>
</body>
</html>
