<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Tag Media HTML</title>
    <link rel="icon" type="image/x-icon" href="logo.ico">
 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
 
    <style>
        /* ===== Warna & ukuran dasar ===== */
        :root {
            --bg: #eef1f7;
            --surface: #ffffff;
            --text: #1b2236;
            --muted: #5d6781;
            --line: #dde2ee;
            --accent: #3b4de0;
            --accent-2: #19b5c9;
            --accent-soft: #e6e9fd;
            --media-bg: #0f1424;
            --shadow: 0 1px 2px rgba(27, 34, 54, .06), 0 10px 28px rgba(27, 34, 54, .07);
            --shadow-hover: 0 2px 4px rgba(27, 34, 54, .08), 0 18px 40px rgba(59, 77, 224, .18);
        }
 
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0c1020;
                --surface: #151b30;
                --text: #e8ebf6;
                --muted: #9aa4c2;
                --line: #263050;
                --accent: #8f9bff;
                --accent-2: #4fd6e8;
                --accent-soft: #232b52;
                --media-bg: #070a15;
                --shadow: none;
                --shadow-hover: 0 18px 40px rgba(0, 0, 0, .45);
            }
        }
 
        /* ===== Reset sederhana ===== */
        *, *::before, *::after { box-sizing: border-box; }
 
        html { scroll-behavior: smooth; }
 
        body {
            position: relative;
            margin: 0;
            min-height: 100vh;
            padding: 3.5rem 1.25rem 4rem;
            background: var(--bg);
            color: var(--text);
            font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
            line-height: 1.6;
            text-align: center;
            overflow-x: hidden;
        }
 
        /* ===== Latar belakang bergerak pelan ===== */
        .blob {
            position: fixed;
            z-index: -1;
            width: 420px;
            height: 420px;
            border-radius: 50%;
            filter: blur(90px);
            opacity: .35;
            pointer-events: none;
        }
 
        .blob-1 {
            top: -120px;
            left: -120px;
            background: var(--accent);
            animation: melayang 14s ease-in-out infinite alternate;
        }
 
        .blob-2 {
            right: -140px;
            bottom: -140px;
            background: var(--accent-2);
            animation: melayang 18s ease-in-out infinite alternate-reverse;
        }
 
        @keyframes melayang {
            from { transform: translate(0, 0) scale(1); }
            to   { transform: translate(70px, 50px) scale(1.15); }
        }
 
        /* ===== Tata letak: semua di tengah ===== */
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 780px;
            margin: 0 auto;
        }
 
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            width: 100%;
        }
 
        /* ===== Header ===== */
        header {
            margin-bottom: 2.5rem;
        }
 
        header h1 {
            margin: 0 0 .75rem;
            font-size: clamp(2rem, 6vw, 3rem);
            font-weight: 800;
            line-height: 1.15;
            letter-spacing: -.02em;
            background: linear-gradient(100deg, var(--accent), var(--accent-2), var(--accent));
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: kilau 6s linear infinite;
        }
 
        header p {
            margin: 0 auto;
            max-width: 46ch;
            color: var(--muted);
        }
 
        @keyframes kilau {
            to { background-position: 200% center; }
        }
 
        /* ===== Kartu per media ===== */
        .section {
            width: 100%;
            padding: 1.5rem;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 20px;
            box-shadow: var(--shadow);
            transition: transform .3s ease, box-shadow .3s ease, border-color .3s ease;
        }
 
        .section:hover {
            transform: translateY(-6px);
            border-color: var(--accent);
            box-shadow: var(--shadow-hover);
        }
 
        .section h2 {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: .6rem;
            margin: 0 0 1.1rem;
            font-size: 1.1rem;
            font-weight: 700;
        }
 
        .section h2 code {
            padding: .15rem .6rem;
            background: var(--accent-soft);
            color: var(--accent);
            border-radius: 6px;
            font-size: .85rem;
            font-weight: 700;
        }
 
        /* ===== Media ===== */
        .media {
            display: block;
            width: 100%;
            margin: 0 auto;
            border-radius: 12px;
        }
 
        img.media {
            max-height: 420px;
            object-fit: contain;
            background: var(--media-bg);
            transition: transform .5s ease;
        }
 
        .section:hover img.media {
            transform: scale(1.03);
        }
 
        audio.media {
            border-radius: 999px;
        }
 
        video.media,
        iframe.media {
            aspect-ratio: 16 / 9;
            height: auto;
            border: 0;
            background: var(--media-bg);
        }
 
        /* ===== Footer ===== */
        footer {
            margin-top: 2.5rem;
            color: var(--muted);
            font-size: .85rem;
        }
 
        /* ===== Animasi muncul (header langsung, kartu saat di-scroll) ===== */
        @keyframes naik {
            from { opacity: 0; transform: translateY(28px); }
            to   { opacity: 1; transform: translateY(0); }
        }
 
        header,
        footer {
            animation: naik .8s ease both;
        }
 
        /* Kartu disembunyikan hanya jika JavaScript aktif */
        .js .reveal {
            opacity: 0;
            transform: translateY(36px);
            transition: opacity .7s ease, transform .7s ease,
                        box-shadow .3s ease, border-color .3s ease;
        }
 
        .js .reveal.tampil {
            opacity: 1;
            transform: translateY(0);
        }
 
        .js .reveal.tampil:hover {
            transform: translateY(-6px);
        }
 
        /* ===== Fokus keyboard ===== */
        :focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 3px;
        }
 
        /* ===== Hormati pengguna yang mematikan animasi ===== */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
                scroll-behavior: auto !important;
            }
            .js .reveal { opacity: 1; transform: none; }
        }
 
        @media (max-width: 480px) {
            body { padding: 2.25rem 1rem 3rem; }
            .section { padding: 1.1rem; border-radius: 16px; }
        }
    </style>
 
    <script>
        // Tandai bahwa JavaScript aktif agar animasi muncul bisa dipakai
        document.documentElement.classList.add('js');
    </script>
</head>
<body>
    <div class="blob blob-1" aria-hidden="true"></div>
    <div class="blob blob-2" aria-hidden="true"></div>
 
    <div class="container">
 
        <header>
            <h1>Latihan Tag Media HTML</h1>
            <p>Kumpulan contoh gambar, audio, video, dan embed yang dipakai dalam satu halaman.</p>
        </header>
 
        <main>
            <!-- Tag img -->
            <section class="section reveal">
                <h2><code>&lt;img&gt;</code> Gambar</h2>
                <img class="media" src="Assets/Jarjit_sing.png" alt="Gambar Jarjit Singh" loading="lazy">
            </section>
 
            <!-- Tag audio -->
            <section class="section reveal">
                <h2><code>&lt;audio&gt;</code> Audio</h2>
                <audio class="media" controls preload="none">
                    <source src="Assets/Last Child - DUKA (Official Lyric Video) __ SORROW.mp3" type="audio/mp3">
                    Browser kamu tidak mendukung tag audio.
                </audio>
            </section>
 
            <!-- Tag video -->
            <section class="section reveal">
                <h2><code>&lt;video&gt;</code> Video</h2>
                <video class="media" controls preload="metadata">
                    <source src="Assets/Kucing.mp4" type="video/mp4">
                    Browser kamu tidak mendukung tag video.
                </video>
            </section>
 
            <!-- Tag embed / iframe: YouTube -->
            <section class="section reveal">
                <h2><code>&lt;iframe&gt;</code> Embed YouTube</h2>
                <iframe
                    class="media"
                    src="https://www.youtube.com/embed/ZBONqmVxYkM?si=A69E6afCTBpULTSc"
                    title="YouTube video player"
                    loading="lazy"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen></iframe>
            </section>
 
            <!-- Tag iframe: video loop dari website lain -->
            <section class="section reveal">
                <h2><code>&lt;iframe&gt;</code> Embed Video Loop</h2>
                <iframe
                    class="media"
                    src="https://onepagelove.com/wp-content/uploads/opl-video/posts/88651/d4ce74f47ea17fd4e890bbf723c6458d/loop.mp4"
                    title="Video loop dari One Page Love"
                    loading="lazy"></iframe>
            </section>
        </main>
 
        <footer>
            <p>Dibuat untuk latihan HTML</p>
        </footer>
 
    </div>
 
    <script>
        // Munculkan setiap kartu saat masuk ke layar
        const kartu = document.querySelectorAll('.reveal');
 
        if ('IntersectionObserver' in window) {
            const pengamat = new IntersectionObserver((daftar) => {
                daftar.forEach((item) => {
                    if (item.isIntersecting) {
                        item.target.classList.add('tampil');
                        pengamat.unobserve(item.target);
                    }
                });
            }, { threshold: 0.15 });
 
            kartu.forEach((el) => pengamat.observe(el));
        } else {
            kartu.forEach((el) => el.classList.add('tampil'));
        }
    </script>
</body>
</html>
